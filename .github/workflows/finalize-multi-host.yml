name: Finalize multi-host SDD
on:
  push:
    branches: ['integration/multi-host-finalize']

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run real multi-host SDD close'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and close real SDD lifecycle
        run: bash .github/finalize-multi-host.sh
