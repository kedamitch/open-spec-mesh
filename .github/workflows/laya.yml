name: GPU factory protocol
on:
  push:
    branches: [main, 'feature/laya-reusable-decisions']
    paths:
      - '.github/workflows/laya.yml'
      - 'mcp/laya*.py'
      - 'integrations/laya-gpu/**'
      - 'tests/test_laya_server.py'
  pull_request:
    paths:
      - '.github/workflows/laya.yml'
      - 'mcp/laya*.py'
      - 'integrations/laya-gpu/**'
      - 'tests/test_laya_server.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  factory:
    name: isolated GPU factory lane (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - run: python -B -m unittest discover -s tests -p 'test_laya_server.py' -v
