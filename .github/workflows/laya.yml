name: Laya integration
on:
  push:
    branches: [main, 'feature/laya-reusable-decisions']
    paths:
      - '.github/workflows/laya.yml'
      - 'mcp/laya*.py'
      - 'scripts/verify_laya.py'
      - 'scripts/install.py'
      - 'scripts/install_toml.py'
      - 'config.toml'
      - 'typesafe-laya/**'
      - 'tests/test_laya*.py'
  pull_request:
    paths:
      - '.github/workflows/laya.yml'
      - 'mcp/laya*.py'
      - 'scripts/verify_laya.py'
      - 'scripts/install.py'
      - 'scripts/install_toml.py'
      - 'config.toml'
      - 'typesafe-laya/**'
      - 'tests/test_laya*.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    name: protocol (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mcp>=2.2,<3' 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - run: python -B -m unittest discover -s tests -p 'test_laya*.py' -v
      - run: python -B scripts/verify_laya.py

  protocol-compat:
    name: protocol (3.13)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'mcp>=2.2,<3' 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - run: python -B -m unittest discover -s tests -p 'test_laya*.py' -v
      - run: python -B scripts/verify_laya.py
