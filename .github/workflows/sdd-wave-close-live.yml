name: Close live SDD wave Change
on:
  push:
    branches: ['sdd/wave-integration']

permissions:
  contents: write

jobs:
  close:
    if: github.event.head_commit.message == 'Temporarily close live SDD wave Change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute lifecycle and persist canonical close artifacts
        shell: bash
        run: |
          set -euo pipefail
          CHG=CHG-20260927-wave-integration
          PLAN=939731a3589f4635d57f7fc38e2e4eafe09b101e
          RUNTIME=48a07524cd1f2b58f48f44485673c4c5b089a4e7
          OBS=4c900e66c9e2494a0e90ccd47200823c6fc8a473
          FINAL=c3b1383121b361e4c548c9b1241e8578f7373ddd
          ROOT="$RUNNER_TEMP/close-sdd"
          WT1="$RUNNER_TEMP/close-runtime"
          WT2="$RUNNER_TEMP/close-observation"
          CHECK1="$RUNNER_TEMP/check-runtime"
          CHECK2="$RUNNER_TEMP/check-observation"
          SNAP="$RUNNER_TEMP/active-change"
          SDD="$GITHUB_WORKSPACE/sdd-change/scripts/sdd.py"

          git clone --no-local "$GITHUB_WORKSPACE" "$ROOT"
          git -C "$ROOT" checkout --detach "$PLAN"
          git -C "$ROOT" config user.name "Open Spec Mesh CI"
          git -C "$ROOT" config user.email "open-spec-mesh@example.invalid"

          git -C "$ROOT" worktree add --detach "$CHECK1" "$RUNTIME"
          python -B -m unittest discover -s "$CHECK1/tests" -p 'test_lean_cli.py' -v
          git -C "$ROOT" worktree remove --force "$CHECK1"

          git -C "$ROOT" worktree add --detach "$CHECK2" "$OBS"
          python -B -m unittest discover -s "$CHECK2/tests" -p 'test_lean_observation.py' -v
          git -C "$ROOT" worktree remove --force "$CHECK2"

          PREP1="$(python "$SDD" prepare "$CHG" --root "$ROOT" --task C03-01 --worktree "$WT1")"
          PREP2="$(python "$SDD" prepare "$CHG" --root "$ROOT" --task C03-02 --worktree "$WT2")"
          ATT1="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["attempt"])' "$PREP1")"
          ATT2="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["attempt"])' "$PREP2")"

          E1="$RUNNER_TEMP/c03-01-evidence.md"
          E2="$RUNNER_TEMP/c03-02-evidence.md"
          python "$SDD" deliver "$CHG" --root "$WT1" --task C03-01 --revision "$RUNTIME" --attempt "$ATT1" --evidence-file "$E1" --draft
          python "$SDD" deliver "$CHG" --root "$WT2" --task C03-02 --revision "$OBS" --attempt "$ATT2" --evidence-file "$E2" --draft
          E1="$E1" E2="$E2" python - <<'PY'
          import os
          from pathlib import Path
          values = {
              'E1': 'C03-01 已核对 wave runtime 实际 diff、33 项定向测试、冲突预检与 ancestry 行为。',
              'E2': 'C03-02 已核对 observation 实际 diff、13 项定向测试与单命令事件语义。',
          }
          for key, replacement in values.items():
              path = Path(os.environ[key])
              path.write_text(path.read_text(encoding='utf-8').replace('待补充。', replacement), encoding='utf-8')
          PY
          python "$SDD" deliver "$CHG" --root "$WT1" --task C03-01 --revision "$RUNTIME" --attempt "$ATT1" --evidence-file "$E1"
          python "$SDD" deliver "$CHG" --root "$WT2" --task C03-02 --revision "$OBS" --attempt "$ATT2" --evidence-file "$E2"

          python "$SDD" close "$CHG" --root "$ROOT" --task C03-01 --accept --from-workspace "$WT1" --reason "C03-01 AC-01/AC-02、Path Contract 与真实测试已核对"
          python "$SDD" close "$CHG" --root "$ROOT" --task C03-02 --accept --from-workspace "$WT2" --reason "C03-02 AC-03、Path Contract 与真实测试已核对"
          python "$SDD" integrate "$CHG" --root "$ROOT" --wave --check
          python "$SDD" integrate "$CHG" --root "$ROOT" --wave

          cp -a "$ROOT/docs/05-changes/C01-进行中/$CHG" "$SNAP"
          git -C "$ROOT" reset --hard "$FINAL"
          rm -rf "$ROOT/docs/05-changes/C01-进行中/$CHG"
          cp -a "$SNAP" "$ROOT/docs/05-changes/C01-进行中/$CHG"

          ROOT="$ROOT" FINAL="$FINAL" python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'sdd-init/scripts'))
          from sdd_common import metadata, render_spec
          path = Path(os.environ['ROOT'])/'docs/05-changes/C01-进行中/CHG-20260927-wave-integration/C01-change.md'
          fields, body = metadata(path.read_text(encoding='utf-8'))
          fields.update(
              integrated_revision=os.environ['FINAL'],
              product='SDD Runtime 支持 accepted/pending wave 一次链式预检与批量集成；observation 记录 wave 级命令事实。',
              technology='IntegrationWave 由 Graph + Git ancestry 派生，不新增持久状态；整波预检先于真实 merge。',
              operations='无常驻服务或部署变化；沿用现有本地与 CI 验证入口。',
          )
          body = body.replace(
              '## 验证结果\n\npending',
              '## 验证结果\n\nAC-01、AC-02、AC-03 已通过真实 Git worktree 生命周期、33 项 runtime 定向测试、13 项 observation 定向测试及项目全量验证。'
          )
          body = body.replace('## 最终结论\n\npending', '## 最终结论\n\npass')
          path.write_text(render_spec(fields, body), encoding='utf-8')
          PY

          python "$GITHUB_WORKSPACE/sdd-close/scripts/run_validation.py" "$CHG" --root "$ROOT" --revision "$FINAL"
          python "$SDD" close "$CHG" --root "$ROOT" --archive

          rm -rf "$GITHUB_WORKSPACE/docs/05-changes/C01-进行中/$CHG"
          cp -a "$ROOT/docs/05-changes/C02-已完成/$CHG" "$GITHUB_WORKSPACE/docs/05-changes/C02-已完成/$CHG"
          cp "$ROOT/docs/05-changes/C01-进行中/index.md" "$GITHUB_WORKSPACE/docs/05-changes/C01-进行中/index.md"
          cp "$ROOT/docs/05-changes/C02-已完成/index.md" "$GITHUB_WORKSPACE/docs/05-changes/C02-已完成/index.md"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/sdd-wave-close-live.yml"

          git -C "$GITHUB_WORKSPACE" config user.name "Open Spec Mesh CI"
          git -C "$GITHUB_WORKSPACE" config user.email "open-spec-mesh@example.invalid"
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "Close wave integration SDD Change"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:sdd/wave-integration
          echo "LIVE_SDD_CLOSE_PERSISTED integrated_revision=$FINAL"
