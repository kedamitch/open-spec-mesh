name: SDD wave live E2E
on:
  push:
    branches: ['sdd/wave-integration']

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real SDD lifecycle in disposable clone
        shell: bash
        run: |
          set -euo pipefail
          CHG=CHG-20260927-wave-integration
          PLAN=939731a3589f4635d57f7fc38e2e4eafe09b101e
          RUNTIME=48a07524cd1f2b58f48f44485673c4c5b089a4e7
          OBS=4c900e66c9e2494a0e90ccd47200823c6fc8a473
          CODE_INTEGRATED=00c7ff2d59428ec08d5289f48c5378814b53d31c
          TRUTH=55719a357e144f6849c13db4ccfc6ef5ba82bc97
          ROOT="$RUNNER_TEMP/live-sdd"
          WT1="$RUNNER_TEMP/live-sdd-runtime"
          WT2="$RUNNER_TEMP/live-sdd-observation"
          SDD="$GITHUB_WORKSPACE/sdd-change/scripts/sdd.py"

          git clone --no-local "$GITHUB_WORKSPACE" "$ROOT"
          git -C "$ROOT" checkout --detach "$PLAN"
          git -C "$ROOT" config user.name "Open Spec Mesh CI"
          git -C "$ROOT" config user.email "open-spec-mesh@example.invalid"

          echo "== planning status =="
          python "$SDD" status "$CHG" --root "$ROOT"

          PREP1="$(python "$SDD" prepare "$CHG" --root "$ROOT" --task C03-01 --worktree "$WT1")"
          PREP2="$(python "$SDD" prepare "$CHG" --root "$ROOT" --task C03-02 --worktree "$WT2")"
          ATT1="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["attempt"])' "$PREP1")"
          ATT2="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["attempt"])' "$PREP2")"

          git -C "$GITHUB_WORKSPACE" diff "$PLAN" "$RUNTIME" -- sdd-change/scripts/sdd.py tests/test_lean_cli.py | git -C "$WT1" apply
          git -C "$WT1" add sdd-change/scripts/sdd.py tests/test_lean_cli.py
          git -C "$WT1" -c user.name="Worker C03-01" -c user.email="worker@example.invalid" commit -m "C03-01 worker result"
          python -B -m unittest discover -s "$WT1/tests" -p 'test_lean_cli.py' -v

          git -C "$GITHUB_WORKSPACE" diff "$PLAN" "$OBS" -- sdd-do/scripts/observation/trace.py tests/test_lean_observation.py | git -C "$WT2" apply
          git -C "$WT2" add sdd-do/scripts/observation/trace.py tests/test_lean_observation.py
          git -C "$WT2" -c user.name="Worker C03-02" -c user.email="worker@example.invalid" commit -m "C03-02 worker result"
          python -B -m unittest discover -s "$WT2/tests" -p 'test_lean_observation.py' -v

          E1="$RUNNER_TEMP/c03-01-evidence.md"
          E2="$RUNNER_TEMP/c03-02-evidence.md"
          python "$SDD" deliver "$CHG" --root "$WT1" --task C03-01 --attempt "$ATT1" --evidence-file "$E1" --draft
          python "$SDD" deliver "$CHG" --root "$WT2" --task C03-02 --attempt "$ATT2" --evidence-file "$E2" --draft
          E1="$E1" E2="$E2" python - <<'PY'
          import os
          from pathlib import Path
          for key in ('E1', 'E2'):
              path = Path(os.environ[key])
              text = path.read_text(encoding='utf-8')
              text = text.replace('待补充。', '已核对实际 diff、定向测试和自审；结果符合冻结 Task Contract。')
              path.write_text(text, encoding='utf-8')
          PY
          python "$SDD" deliver "$CHG" --root "$WT1" --task C03-01 --attempt "$ATT1" --evidence-file "$E1"
          python "$SDD" deliver "$CHG" --root "$WT2" --task C03-02 --attempt "$ATT2" --evidence-file "$E2"

          python "$SDD" close "$CHG" --root "$ROOT" --task C03-01 --accept --from-workspace "$WT1" --reason "C03-01 Path Contract、AC-01/AC-02 与定向测试已核对"
          python "$SDD" close "$CHG" --root "$ROOT" --task C03-02 --accept --from-workspace "$WT2" --reason "C03-02 Path Contract、AC-03 与定向测试已核对"

          echo "== accepted, pending integration =="
          python "$SDD" status "$CHG" --root "$ROOT"
          python "$SDD" integrate "$CHG" --root "$ROOT" --wave --check
          python "$SDD" integrate "$CHG" --root "$ROOT" --wave

          git -C "$GITHUB_WORKSPACE" diff "$CODE_INTEGRATED" "$TRUTH" --             AGENTS.md             docs/02-product/P02-modules/P02-01-sdd-runtime.md             docs/02-product/P02-modules/P02-04-behavior-observation.md             docs/03-architecture/T02-api.md             docs/03-architecture/T04-domain-model.md             sdd-init/references/runtime-guide.md | git -C "$ROOT" apply
          git -C "$ROOT" add             AGENTS.md             docs/02-product/P02-modules/P02-01-sdd-runtime.md             docs/02-product/P02-modules/P02-04-behavior-observation.md             docs/03-architecture/T02-api.md             docs/03-architecture/T04-domain-model.md             sdd-init/references/runtime-guide.md
          git -C "$ROOT" commit -m "Sync wave integration Current Truth"
          INTEGRATED="$(git -C "$ROOT" rev-parse HEAD)"

          ROOT="$ROOT" INTEGRATED="$INTEGRATED" python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'sdd-init/scripts'))
          from sdd_common import metadata, render_spec
          path = Path(os.environ['ROOT'])/'docs/05-changes/C01-进行中/CHG-20260927-wave-integration/C01-change.md'
          fields, body = metadata(path.read_text(encoding='utf-8'))
          fields.update(
              integrated_revision=os.environ['INTEGRATED'],
              product='SDD Runtime 支持当前 accepted/pending wave 一次预检与批量集成；observation 记录 wave 级命令事实。',
              technology='IntegrationWave 由 Graph + Git ancestry 派生，不新增持久状态；整波链式预检先于真实 merge。',
              operations='无常驻服务与部署变化；验证仍使用现有本地/CI 入口。',
          )
          body = body.replace(
              '## 验证结果\n\npending',
              '## 验证结果\n\nAC-01、AC-02、AC-03 已通过真实 Git worktree 生命周期、定向测试与项目全量验证。'
          )
          body = body.replace('## 最终结论\n\npending', '## 最终结论\n\npass')
          path.write_text(render_spec(fields, body), encoding='utf-8')
          PY

          python "$GITHUB_WORKSPACE/sdd-close/scripts/run_validation.py" "$CHG" --root "$ROOT" --revision "$INTEGRATED"
          python "$SDD" close "$CHG" --root "$ROOT" --archive

          test ! -e "$ROOT/docs/05-changes/C01-进行中/$CHG"
          test -d "$ROOT/docs/05-changes/C02-已完成/$CHG"
          echo "LIVE_SDD_E2E_PASS integrated_revision=$INTEGRATED"
