name: SDD validation
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Node ${{ matrix.node }} core + local/global npm consumer
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22.x', '24.x']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/sdd_validate.js --profile core

  full:
    name: Full native host compatibility
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Install Mermaid renderer outside the repository
        run: npm install --prefix "$RUNNER_TEMP/mermaid" --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@11.12.0
      - name: Install native host CLIs (no model requests)
        run: |
          npm install --global @openai/codex@0.155.1 @opencode/cli@latest @anthropic-ai/claude-code@latest
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/mermaid/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Full required validation profile
        env:
          CONTEXT7_API_KEY: ci-placeholder-not-a-real-key
          TAVILY_API_KEY: ci-placeholder-not-a-real-key
        run: node scripts/sdd_validate.js --profile full
