name: SDD validation
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B scripts/sdd_validate.py

  python-compat:
    name: compatibility (3.13)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/sdd_validate.py

  diagrams:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/mermaid" @mermaid-js/mermaid-cli@11.12.0
      - run: python scripts/render_mermaid.py --mmdc "$RUNNER_TEMP/mermaid/node_modules/.bin/mmdc" --output "$RUNNER_TEMP/rendered"
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-rendered
          path: ${{ runner.temp }}/rendered

  docker:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_docker.py

  codex-runtime:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @openai/codex@0.155.1
      - run: python scripts/verify_codex.py

  opencode-runtime:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --global @opencode/cli@latest
      - run: python -B scripts/verify_opencode.py

  claude-runtime:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: python -B scripts/verify_claude.py

  research-tools:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real latest-package and CodeGraph CLI smoke (no API authentication)
        env:
          CONTEXT7_API_KEY: ci-placeholder-not-a-real-key
          TAVILY_API_KEY: ci-placeholder-not-a-real-key
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import tomllib
          sys.path.insert(0, 'scripts')
          import install
          with tempfile.TemporaryDirectory(prefix='research-tools-smoke-') as tmp:
              home = Path(tmp)/'home'
              commands = install.ensure_research_tools(home, reporter=print)
              text = install.merged_config(Path.cwd(), home/'config.toml', commands)
              cfg = tomllib.loads(text)
              assert cfg['mcp_servers']['codegraph']['args'] == ['serve', '--mcp']
              for server, package, binary, _ in install.RESEARCH_TOOLS:
                  manifest = json.loads((home/install.TOOLS_DIR/server/'node_modules'/package/'package.json').read_text())
                  assert manifest['name'] == package
                  assert Path(commands[server]).is_file()
                  print(server, manifest['name'], manifest['version'])
              version = subprocess.run([commands['codegraph'], '--version'], check=True, text=True,
                                       capture_output=True, timeout=30, env=install.research_install_env())
              assert version.stdout.strip()
              help_result = subprocess.run([commands['codegraph'], 'serve', '--help'], check=True, text=True,
                                           capture_output=True, timeout=30, env=install.research_install_env())
              assert '--mcp' in help_result.stdout
              (home/'config.toml').write_text(text)
              assert install.ensure_research_tools(home) == commands
              print('Package/CLI smoke passed; no authenticated Tavily/Context7 request was made.')
          PY
