<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Open Spec Mesh agent collaboration</title>
<desc id="desc">Developer works through Main. Main coordinates Architect, Worker, Reviewer, Explorer and Librarian. Architect produces specs, Worker produces delivery, and Main integrates, validates and closes.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity=".10"/></filter>
</defs>
<rect x="12" y="12" width="1176" height="596" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="70" y="72" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Agent Mesh</text>
<text x="70" y="105" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#94a3b8">Roles collaborate around specs; scripts keep lifecycle and evidence deterministic.</text>

<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M195 310 H315"/>
  <path d="M445 285 C500 235,525 205,585 190"/>
  <path d="M445 300 C500 290,525 285,585 285"/>
  <path d="M445 318 C500 330,525 365,585 380"/>
  <path d="M445 335 C500 390,525 455,585 475"/>
  <path d="M745 190 C810 190,825 160,885 155"/>
  <path d="M745 285 C810 285,825 295,885 300"/>
  <path d="M745 380 C810 380,825 410,885 420"/>
  <path d="M745 475 C810 475,825 465,885 455"/>
  <path d="M665 215 C665 245,665 325,665 355" stroke-dasharray="8 8"/>
  <path d="M685 215 C735 250,775 410,885 455" stroke-dasharray="8 8"/>
</g>

<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow)">
  <rect x="70" y="255" width="125" height="110" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="132.5" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Developer</text>
  <text x="132.5" y="329" text-anchor="middle" font-size="14" fill="#94a3b8">goal + approval</text>

  <rect x="315" y="245" width="130" height="130" rx="26" fill="#6366f1"/>
  <text x="380" y="302" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Main</text>
  <text x="380" y="332" text-anchor="middle" font-size="14" fill="#e0e7ff">coordinate</text>

  <rect x="585" y="145" width="160" height="90" rx="20" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="665" y="183" text-anchor="middle" font-size="18" font-weight="700" fill="#e0e7ff">Architect</text>
  <text x="665" y="208" text-anchor="middle" font-size="13" fill="#a5b4fc">plan + task graph</text>

  <rect x="585" y="240" width="160" height="90" rx="20" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="665" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#dbeafe">Worker</text>
  <text x="665" y="303" text-anchor="middle" font-size="13" fill="#93c5fd">implement + test</text>

  <rect x="585" y="335" width="160" height="90" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="665" y="373" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Reviewer</text>
  <text x="665" y="398" text-anchor="middle" font-size="13" fill="#94a3b8">optional review</text>

  <rect x="585" y="430" width="160" height="90" rx="20" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="625" y="468" text-anchor="middle" font-size="17" font-weight="700" fill="#bbf7d0">Explorer</text>
  <text x="625" y="493" text-anchor="middle" font-size="12" fill="#86efac">local evidence</text>
  <line x1="665" y1="445" x2="665" y2="505" stroke="#166534" stroke-width="2"/>
  <text x="705" y="468" text-anchor="middle" font-size="17" font-weight="700" fill="#fde68a">Librarian</text>
  <text x="705" y="493" text-anchor="middle" font-size="12" fill="#fbbf24">external evidence</text>

  <rect x="885" y="115" width="245" height="80" rx="20" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
  <text x="1007.5" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#f3e8ff">Change · Design · Task Graph</text>
  <text x="1007.5" y="172" text-anchor="middle" font-size="13" fill="#d8b4fe">persistent planning truth</text>

  <rect x="885" y="260" width="245" height="80" rx="20" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="1007.5" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#dbeafe">Delivery</text>
  <text x="1007.5" y="317" text-anchor="middle" font-size="13" fill="#93c5fd">implementation evidence</text>

  <rect x="885" y="380" width="245" height="80" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="1007.5" y="413" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Independent review</text>
  <text x="1007.5" y="437" text-anchor="middle" font-size="13" fill="#94a3b8">only when explicitly requested</text>

  <rect x="885" y="420" width="245" height="95" rx="20" fill="#052e16" stroke="#22c55e" stroke-width="2" opacity="0"/>
  <rect x="885" y="485" width="245" height="80" rx="20" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="1007.5" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#bbf7d0">Integration · Validation · Close</text>
  <text x="1007.5" y="542" text-anchor="middle" font-size="13" fill="#86efac">final project evidence</text>
</g>

<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">
  <text x="500" y="235">plan</text>
  <text x="500" y="284">execute</text>
  <text x="500" y="355">review</text>
  <text x="500" y="450">evidence</text>
</g>
</svg>