<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Open Spec Mesh agent collaboration</title>
<desc id="desc">Developer works through Main. Main coordinates Architect, Worker, Reviewer, Explorer and Librarian. Architect produces specs, Worker produces delivery, and Main integrates, validates and closes.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect x="12" y="12" width="1176" height="596" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="70" y="72" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#0f172a">Agent Mesh</text>
<text x="70" y="105" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#64748b">Roles collaborate around specs; scripts keep lifecycle and evidence deterministic.</text>

<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M195 310 H315"/>
  <path d="M445 285 C500 235,525 205,585 190"/>
  <path d="M445 300 C500 290,525 285,585 285"/>
  <path d="M445 318 C500 330,525 365,585 380"/>
  <path d="M445 335 C500 390,525 455,585 475"/>
  <path d="M745 190 C810 190,825 160,885 155"/>
  <path d="M745 285 C810 285,825 295,885 300"/>
  <path d="M745 380 C810 380,825 410,885 420"/>
  <path d="M745 475 C810 475,825 465,885 455"/>
  <path d="M665 215 C665 245,665 325,665 355" stroke-dasharray="8 8"/>
  <path d="M685 215 C735 250,775 410,885 455" stroke-dasharray="8 8"/>
</g>

<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow)">
  <rect x="70" y="255" width="125" height="110" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="132.5" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Developer</text>
  <text x="132.5" y="329" text-anchor="middle" font-size="14" fill="#64748b">goal + approval</text>

  <rect x="315" y="245" width="130" height="130" rx="26" fill="#4f46e5"/>
  <text x="380" y="302" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Main</text>
  <text x="380" y="332" text-anchor="middle" font-size="14" fill="#e0e7ff">coordinate</text>

  <rect x="585" y="145" width="160" height="90" rx="20" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="665" y="183" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Architect</text>
  <text x="665" y="208" text-anchor="middle" font-size="13" fill="#6366f1">plan + task graph</text>

  <rect x="585" y="240" width="160" height="90" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="665" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Worker</text>
  <text x="665" y="303" text-anchor="middle" font-size="13" fill="#3b82f6">implement + test</text>

  <rect x="585" y="335" width="160" height="90" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="665" y="373" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Reviewer</text>
  <text x="665" y="398" text-anchor="middle" font-size="13" fill="#64748b">optional review</text>

  <rect x="585" y="430" width="160" height="90" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="625" y="468" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Explorer</text>
  <text x="625" y="493" text-anchor="middle" font-size="12" fill="#16a34a">local evidence</text>
  <line x1="665" y1="445" x2="665" y2="505" stroke="#bbf7d0" stroke-width="2"/>
  <text x="705" y="468" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Librarian</text>
  <text x="705" y="493" text-anchor="middle" font-size="12" fill="#d97706">external evidence</text>

  <rect x="885" y="115" width="245" height="80" rx="20" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="1007.5" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#581c87">Change · Design · Task Graph</text>
  <text x="1007.5" y="172" text-anchor="middle" font-size="13" fill="#9333ea">persistent planning truth</text>

  <rect x="885" y="260" width="245" height="80" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1007.5" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Delivery</text>
  <text x="1007.5" y="317" text-anchor="middle" font-size="13" fill="#3b82f6">implementation evidence</text>

  <rect x="885" y="380" width="245" height="80" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1007.5" y="413" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Independent review</text>
  <text x="1007.5" y="437" text-anchor="middle" font-size="13" fill="#64748b">only when explicitly requested</text>

  <rect x="885" y="420" width="245" height="95" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2" opacity="0"/>
  <rect x="885" y="485" width="245" height="80" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="1007.5" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Integration · Validation · Close</text>
  <text x="1007.5" y="542" text-anchor="middle" font-size="13" fill="#16a34a">final project evidence</text>
</g>

<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#64748b">
  <text x="500" y="235">plan</text>
  <text x="500" y="284">execute</text>
  <text x="500" y="355">review</text>
  <text x="500" y="450">evidence</text>
</g>
</svg>