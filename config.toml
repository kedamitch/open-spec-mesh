# Sanitized baseline for Open Spec Mesh.
# Keep credentials and machine-specific project entries out of version control.

model_provider = "custom"
model = "gpt-6-luna"
model_reasoning_effort = "max"
disable_response_storage = true
web_search = "live"

[model_providers.custom]
name = "Custom Provider"
base_url = "http://127.0.0.1:8080"
wire_api = "responses"
requires_openai_auth = true

[mcp_servers]

# https://github.com/colbymchenry/codegraph
[mcp_servers.codegraph]
type = "stdio"
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.openaiDeveloperDocs]
type = "http"
url = "https://developers.openai.com/mcp"

[mcp_servers.github]
type = "http"
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.context7]
type = "stdio"
command = "context7-mcp"
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers.tavily]
type = "stdio"
command = "tavily-mcp"
env_vars = ["TAVILY_API_KEY"]

# System One HTTP bridge: local Laya batch service or TypeSafe Jev API.
[mcp_servers.laya]
enabled = false
type = "stdio"
command = "node"
args = ["mcp/laya_http_mcp.js"]
env_vars = ["SYSTEMONE_PROVIDER", "SYSTEMONE_TIMEOUT_SECONDS", "SYSTEMONE_MODEL_REVISION", "SYSTEMONE_METRICS_PATH", "LAYA_BASE_URL", "LAYA_API_KEY", "LAYA_MODEL", "LAYA_MODEL_REVISION", "LAYA_TIMEOUT_SECONDS", "LAYA_TEMPLATE_DIR", "LAYA_METRICS_PATH", "TYPESAFE_API_KEY", "TYPESAFE_BASE_URL", "TYPESAFE_DEFAULT_MODEL"]

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used", "context-window-size", "fast-mode"]
status_line_use_colors = true

[features]
multi_agent = true

[features.multi_agent_v2]
enabled = true
tool_namespace = "agents"
max_concurrent_threads_per_session = 4
hide_spawn_agent_metadata = false
expose_spawn_agent_model_overrides = false
wait_agent_enabled = true
root_agent_usage_hint_text = "Use configured agent_type with fork_turns=\"none\" for specialist roles. Role TOML owns model and reasoning effort; do not override them at spawn time."
subagent_usage_hint_text = "Only delegate when the active role instructions explicitly allow it. Configured specialist roles use fork_turns=\"none\" and receive explicit task context."

# Role descriptions below are mirrors of agents/*.toml and CI-validated.
[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[agents.architect]
description = "适用：SDD 当前已授权阶段的整体设计、执行计划（任务拆分与任务级设计）和文档辅助，可委派 Explorer/Librarian；不适用：实现、自动拆图和最终验收。"
config_file = "agents/architect.toml"

[agents.worker]
description = "适用：已获用户授权的并行实现，按宏观 Task 自主实现、测试、自审、修复和 Delivery；串行由当前 Agent 完成，不启动 Worker；不可委派。"
config_file = "agents/worker.toml"

[agents.reviewer]
description = "适用：用户明确要求的独立复审，核对目标、真实 diff 和验证证据；不适用：默认审查、设计、实现和最终用户验收；只读不可委派。"
config_file = "agents/reviewer.toml"

[agents.explorer]
description = "适用：Quick / SDD 的陌生本地实现、调用链、数据、测试和部署事实；已有证据充分的单点直接读取；只读不可委派。"
config_file = "agents/explorer.toml"

[agents.librarian]
description = "适用：Quick / SDD 的外部当前文档、协议、SDK、版本和供应商事实；不适用：本地源码实现；只读不可委派。"
config_file = "agents/librarian.toml"
