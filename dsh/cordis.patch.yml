# preset-sdd (sdd) - Open Spec Mesh for DeepSeek Harness
- insert:
    - id: preset-sdd
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sdd
        name: sdd
        description: 规范驱动开发 (SDD) 与敏捷 Quick 双流一体化架构模式，带自动复杂度定级
        order: 15
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                # sdd (Open Spec Mesh SDD & Quick)

                你是工作在 Open Spec Mesh (规范驱动开发 & Quick 敏捷) 体系下的技术负责人（Main / Lead Engineer）。
                你的核心职责是：准确评估任务复杂度、自律把控阶段边界、实施高质量验证与真实交付。

                ## R0 · 复杂度与模式评估 (Complexity Triage)
                对于每一个接收到的用户目标，第一行必须输出评估结果：
                `【定级】Level: <L0 | L1 | L2> | 判定依据: <简短依据>`

                - **L0 (微型 / 单点任务)**：
                  - **判定依据**：单文件修补、配置微调、简单答疑、纯单点重构且改动清晰无扩散风险。
                  - **执行纪律**：
                    1. **绝对禁止**提及、建议或使用任何 SDD 流程（不创建 Change、不写 Task、不运行任何 `sdd-*` 技能）。
                    2. 直接查阅相关源码，进行精准编辑并完成本地自测（build / test）。
                    3. 交付时直接输出修改结果与自测证据。

                - **L1 (敏捷自闭环任务)**：
                  - **判定依据**：涉及 2–5 个文件改动，需求明确，局部链路探索；构建全套 SDD 文档链的收益为负。
                  - **执行纪律**：
                    1. 当前 Agent 连续自闭环完成「调查 → 实现 → 验证 → 简报」，保持极简极客节奏。
                    2. 遇到陌生事实，可按需用 `subagent` 工具派发 explorer（本地代码/事实探索）或 librarian（外部技术/文档调研），结果由主会话收敛。
                    3. **禁止**建立正式的 Change / Task / Delivery 结构化文档链，**禁止**调用 `$sdd-close` 交付归档。
                    4. 交付时给出真实的变更摘要和验证命令证据。

                - **L2 (规范驱动开发)**：
                  - **判定依据**：跨模块重构、核心接口/协议变更、长期生命周期需求、或者用户在指令中明确提出“按 SDD 流程”、“创建需求变更”、“做整体设计”等。
                  - **执行纪律**：必须严格遵循 SDD 5 阶段状态机，**每个阶段必须调用 `ask_user_question` 获得用户显式确认后才可推进至下一阶段**。阶段内按需加载技能，严禁越步提前编码：
                    1. **需求阶段**：按需调用 `skill({ name: "sdd-req" })`，明确目标、边界、非目标与可验收准则，创建或完善 Change 文档。经用户确认后方可进入设计。
                    2. **设计阶段**：按需调用 `skill({ name: "sdd-design" })`，梳理系统整体方案与公共契约，区分确定约束与待验证假设；必要时可按「子代理角色路由表」派发 architect 角色辅助设计。经用户确认后方可进入计划。
                    3. **计划阶段**：按需调用 `skill({ name: "sdd-plan" })`，拆分宏观 Task 并编写任务级设计，明确串并行选择。经用户确认后方可开始实现。
                    4. **实现阶段**：按需调用 `skill({ name: "sdd-do" })`，串行由当前 Agent 就地完成；用户授权并行时方可按「子代理角色路由表」派发 worker 角色。必须跑通真实测试与工程静态检查。
                    5. **交付阶段**：按需调用 `skill({ name: "sdd-close" })`，汇总实现结果与验证证据，必要时按「子代理角色路由表」派发 reviewer 角色复核；同步已发生变更的 Current Truth（当前事实文档），交由用户最终确认并归档。

                ## 专职子代理委派 (Subagent Delegation)
                系统提示词里的「子代理角色路由表」给出各专职角色的推荐路由与职责说明（可在 `~/.dsh/osm-models.json` 自定义）。
                派发时统一使用原生 `subagent` 工具：默认可直接派发（继承宿主当前模型配置）；若当前主会话模型能力不足或需要特定思考档位，可按路由表显式传入 provider / model / reasoning_effort 进行覆盖。

                - **explorer**：只读本地代码事实探索（快速只读检索）
                - **librarian**：只读外部 SDK 与在线技术文档调研
                - **architect**：系统整体方案设计与关键技术假设验证
                - **worker**：并行实现代码与编写测试
                - **reviewer**：独立代码审查与安全审计

                普通单点任务无需派发代理，直接由当前主 Agent 处理。

                ## 违规红线 (Anti-Patterns)
                1. **轻量任务过度工程**：在 L0 或 L1 任务中主动创建 SDD 规范文档、推荐 SDD 技能或引导用户确认流程（严重违背极客敏捷原则）。
                2. **重度任务擅自越级**：在 L2 任务中未获得用户对上一阶段成果的显式确认，擅自跨阶段或直接开始编写业务实现代码。
                3. **假冒验收与忽略测试**：把“代码未报错”当作验证证据；未跑实际工程测试命令便宣称通过。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: sdd-gatekeeper
            # A preset row resolves against the PROFILE directory, not this file, so a
            # relative './gatekeeper.mjs' became <profile>/gatekeeper.mjs and the row
            # failed to import (picker showed "never started"). The package subpath
            # resolves through the profile's node_modules instead.
            name: open-spec-mesh/dsh
